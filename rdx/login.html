<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Popup Manager Login – Gymkhana IITK</title>
    <link rel="icon" type="image/png" href="../assets/images/wuj.jpg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <img src="../assets/images/wuj.jpg" alt="Logo" class="login-logo" />
            <h1>📢 Popup Manager</h1>
            <p>Students' Gymkhana IIT Kanpur</p>
        </div>
        
        <div id="loginMessage" class="login-message"></div>
        
        <button id="googleLoginBtn" class="btn-google">
            <i class="fab fa-google"></i> Sign in with Google
        </button>
        
        <div id="loadingSpinner" class="spinner hidden">
            <i class="fas fa-spinner fa-spin"></i> Authenticating...
        </div>
        
        <div class="login-footer">
            <small>⚠️ Only authorized admins can access this portal.</small>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDdr1WNCA-DPYo5N1Ea0uH_hA9PfkRYyX8",
        authDomain: "gymkhanaiitk.firebaseapp.com",
        databaseURL: "https://gymkhanaiitk-default-rtdb.firebaseio.com",
        projectId: "gymkhanaiitk",
        storageBucket: "gymkhanaiitk.firebasestorage.app",
        messagingSenderId: "389270259342",
        appId: "1:389270259342:web:65e918f934c8cc83b6ebdf",
        measurementId: "G-4619G68V49"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    const ALLOWED_EMAIL = "gymkhana.iitkanpur@gmail.com";
    const loginMessage = document.getElementById('loginMessage');
    const googleBtn = document.getElementById('googleLoginBtn');
    const loadingSpinner = document.getElementById('loadingSpinner');

    function showMessage(text, type = 'error') {
        loginMessage.textContent = text;
        loginMessage.className = 'login-message ' + type;
    }

    googleBtn.addEventListener('click', () => {
        googleBtn.disabled = true;
        loadingSpinner.classList.remove('hidden');
        loginMessage.className = 'login-message';

        auth.signInWithPopup(provider)
            .then((result) => {
                const user = result.user;
                if (user.email === ALLOWED_EMAIL) {
                    showMessage('✅ Login successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    showMessage('❌ Access Denied! Only authorized admins can access this portal.', 'error');
                    auth.signOut();
                    setTimeout(() => {
                        googleBtn.disabled = false;
                        loadingSpinner.classList.add('hidden');
                    }, 2000);
                }
            })
            .catch((error) => {
                showMessage('❌ Login failed: ' + error.message, 'error');
                googleBtn.disabled = false;
                loadingSpinner.classList.add('hidden');
            });
    });

    auth.onAuthStateChanged((user) => {
        if (user && user.email === ALLOWED_EMAIL) {
            window.location.href = 'index.html';
        }
    });
</script>

</body>
</html>
