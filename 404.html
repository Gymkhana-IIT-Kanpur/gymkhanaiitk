<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>404 - Page Not Found | Students' Gymkhana – IIT Kanpur</title>
    <link rel="icon" type="image/png" href="assets/images/wuj.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a1a; color: #ffffff; overflow-x: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; width: 100%; }

        /* Glowing Effect */
        .glow-text { background: linear-gradient(135deg, #ffffff 20%, #ffd700 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 50px rgba(255, 215, 0, 0.2); }
        .error-code { font-size: 8rem; font-weight: 900; line-height: 1; background: linear-gradient(180deg, #ffd700, #ff8c00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 30px rgba(255,215,0,0.3)); animation: float 4s ease-in-out infinite; }

        .btn-glow { display: inline-block; padding: 14px 44px; border-radius: 60px; background: linear-gradient(135deg, #ffd700, #f0a500); color: #0a0a1a; font-weight: 700; font-size: 1.05rem; box-shadow: 0 0 40px rgba(255, 215, 0, 0.2); transition: 0.3s ease; }
        .btn-glow:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(255, 215, 0, 0.4); }

        .navbar { background: rgba(10, 10, 26, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 215, 0, 0.15); padding: 14px 0; }
        .navbar .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.2rem; color: #fff; }
        .navbar .logo img { height: 44px; border-radius: 10px; filter: drop-shadow(0 0 12px rgba(255,215,0,0.3)); }

        .footer { background: rgba(5, 5, 18, 0.95); backdrop-filter: blur(8px); border-top: 1px solid rgba(255, 215, 0, 0.08); padding: 24px 0; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @media (max-width: 480px) { .error-code { font-size: 5.5rem; } }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container flex justify-between items-center">
            <a href="index.html" class="logo">
                <img src="assets/images/wuj.jpg" alt="Logo" onerror="this.style.display='none'">
                <span>Students' Gymkhana</span>
            </a>
            <div class="text-sm text-gray-400">IIT Kanpur</div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center text-center px-4 my-12" style="background: radial-gradient(circle at center, rgba(255,215,0,0.03), transparent 70%);">
        <div class="max-w-xl w-full">
            <div class="error-code">404</div>
            <h1 class="text-3xl md:text-4xl font-extrabold mt-4 mb-3 glow-text">Lost in Space?</h1>
            <p class="text-gray-400 text-base md:text-lg mb-8 leading-relaxed">
                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back on track!
            </p>
            <a href="index.html" class="btn-glow">
                <i class="fa-solid fa-house mr-2"></i> Go Back Home
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer text-center">
        <div class="container">
            <p class="text-gray-600 text-xs">&copy; Students' Gymkhana, IIT Kanpur. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
